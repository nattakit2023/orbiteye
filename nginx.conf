# =============================================================
# Nginx config สำหรับ Orbiteye Frontend (Vite + React Router)
# =============================================================

# Map compression types
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

# Hide nginx version ใน response headers
server_tokens off;

# Logging
log_format main '$remote_addr - $remote_user [$time_local] '
                '"$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log main;
error_log  /var/log/nginx/error.log warn;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default charset
    charset utf-8;

    # -----------------------------------------------------------
    # Security headers — ป้องกัน XSS, clickjacking, MIME sniffing
    # -----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP สำหรับ React + Leaflet (ปรับตามการใช้งานจริง)
    # connect-src 'self' https://*.tile.openstreetmap.org http://localhost:4321 ws: wss:;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:4321 https://* http://* ws: wss:; font-src 'self' data:;" always;

    # -----------------------------------------------------------
    # Healthcheck endpoint
    # -----------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------
    # (Optional) Reverse proxy API ไปยัง backend
    # เปิดใช้เมื่อต้องการให้ frontend เรียก /graphql แบบ same-origin
    # ตั้ง BACKEND_URL ผ่าน env แล้วใช้ envsubst ตอน run container
    # -----------------------------------------------------------
    location /graphql {
        proxy_pass         ${BACKEND_URL}/graphql;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # -----------------------------------------------------------
    # Static assets — cache นาน (Vite จะ hash ชื่อไฟล์อยู่แล้ว)
    # -----------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # Hashed assets ของ Vite อยู่ใต้ /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
        try_files $uri =404;
    }

    # Service worker ไม่ควร cache นานเกินไป
    location ~* \.(?:json|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # SPA fallback — สำคัญมากสำหรับ React Router
    # ถ้า URL ไม่ตรงกับไฟล์ใด ๆ ให้ส่งไปยัง index.html เพื่อให้ React จัดการต่อ
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ไม่ให้คนอื่นอ่าน .env / .git / hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}